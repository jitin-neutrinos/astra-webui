<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/astra-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f2ec" />
    <script>
      // Pre-paint theme: no flash. Default dark; restore saved preference.
      // The runtime toggle (theme-toggle.tsx apply()) keeps the FIRST
      // theme-color meta in sync; the media-query variant stays as the
      // no-JS/system-preference fallback and is never written to.
      (function () {
        try {
          var t = localStorage.getItem("astra-theme");
          if (t === "light") {
            document.documentElement.setAttribute("data-theme", "light");
            document.querySelector('meta[name="theme-color"]:not([media])').setAttribute("content", "#f5f2ec");
          }
        } catch (e) {}
      })();
    </script>
    <!-- Self-hosted brand fonts (perf audit R4): same families/weights as the
         old fonts.googleapis.com link, but served from our own origin. That
         link was RENDER-BLOCKING and third-party, so every cold start paid a
         DNS lookup + TLS handshake to Google before the first paint. These two
         preloads cover the faces above the fold; the rest stream in normally
         (every @font-face keeps font-display: swap). -->
    <link rel="preload" href="/fonts/f01-rP2Hp2ywxg089UriCZOIHTWEBlw.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/f10-nuFiD-vYSZviVYUb_rj3ij__anPXDTjYgEM86xRbPQ.woff2" as="font" type="font/woff2" crossorigin />
    <title>Astra</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
